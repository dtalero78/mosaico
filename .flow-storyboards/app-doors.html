<!--
  PLANTILLA flow-storyboard — MAPA DE PUERTAS DE COMUNICACIÓN (data-driven).
  Clona y reemplaza SOLO: la var REPO y el array DOORS (y si hace falta
  GROUPS_IN/GROUPS_OUT). El renderer y el CSS NO se tocan.
  Layout: app en el centro, ENTRADAS (inbound) a la izquierda en una sola
  columna (una fila por puerta), SALIDAS (outbound) a la derecha. Clic en una
  puerta → se abre un PANEL LATERAL a la derecha (no reemplaza el mapa; cierra
  con × o Esc). Autocontenido (sin red). Cada puerta lleva archivo:línea real.

<style>

  .info{position:fixed;top:18px;left:18px;z-index:10;background:rgba(19,22,28,.9);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-width:366px}

  .url.usedin{color:var(--ink)}

</style>

/* ====== RENDERER (FIJO — no tocar) ====== */
var cv=document.getElementById('cv'), vp=document.getElementById('vp');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function door(id){for(var i=0;i<DOORS.length;i++)if(DOORS[i].id===id)return DOORS[i];return null;}
var BASE='https://mosaicosorobanplataforma.com'; /* ← dominio base de producción (para componer las URLs inbound) */
function urlsFor(d){
  if(d.urls&&d.urls.length)return d.urls;
  var e=(d.endpoint||'').trim();
  if(d.dir==='in'){
    if(d.type==='cron'||d.type==='websocket')return [];
    var p=e.replace(/^(GET|POST|PUT|PATCH|DELETE|multipart)\s+/,'').replace(/\s+stream$/,'').trim();
    return p.charAt(0)==='/'?[BASE+p]:[];
  }
  var tok=e.split(/\s/)[0];
  if(/^https?:\/\//.test(tok))return [tok];
  if(/^[a-z0-9.-]+\.[a-z]{2,}/i.test(tok))return ['https://'+tok];
  return [];
}
function authMeta(a){var m={public:['var(--red)','Abierta'],none:['var(--red)','Sin llave'],soft:['var(--yellow)','Semi-abierta'],jwt:['var(--green)','Con sesión'],'api-key':['var(--amber)','Con clave'],signed:['var(--amber)','Con firma'],internal:['var(--gray)','Interna']};return m[a]||['var(--accent)',a];}
function protoPlain(p){if(/\//.test(p))return 'Consulta y envío';var m={GET:'Consulta (lee)',POST:'Envío (recibe datos)','GET stream':'En vivo',multipart:'Sube archivo',cron:'Automático',ws:'Tiempo real',SDK:'Conexión',REST:'Conexión',SMTP:'Correo',TCP:'Conexión',URL:'Enlace',CLI:'Programa local',DevTools:'Programa local'};if(m[p])return m[p];if(/SDK|REST|TCP|DevTools|HTTP/i.test(p))return 'Conexión';if(/SMTP|mail/i.test(p))return 'Correo';if(/CLI/i.test(p))return 'Programa local';if(/cron/i.test(p))return 'Automático';return p;}
function flagDot(f){if(!f||!f.length)return '';var hi=f.some(function(x){return x.s==='alto';}),md=f.some(function(x){return x.s==='medio';});var c=hi?'var(--red)':(md?'var(--amber)':'var(--accent)');return '<span class="fdot" style="color:'+c+'">🚩'+f.length+'</span>';}
function doorCard(d){var inbound=d.dir==='in';var col=inbound?authMeta(d.auth)[0]:'var(--accent)';var badge=inbound?'<span class="dbadge" style="background:'+authMeta(d.auth)[0]+'22;color:'+authMeta(d.auth)[0]+'">'+authMeta(d.auth)[1]+'</span>':'<span class="dbadge" style="background:rgba(74,125,255,.13);color:#8ab4ff">'+esc(protoPlain(d.protocol))+'</span>';var side=inbound?'border-right-color:':'border-left-color:';return '<div class="door" data-door="'+d.id+'" style="'+side+col+'">'+flagDot(d.flags)+'<div class="dt">'+(d.icon||'')+' '+esc(d.title)+'</div><div class="de">'+esc(d.endpoint)+'</div>'+badge+'</div>';}
function buildSide(dir,groups){var h='';for(var g=0;g<groups.length;g++){var grp=groups[g],ds=DOORS.filter(function(d){return d.dir===dir&&d.type===grp.type;});if(!ds.length)continue;h+='<div class="grp"><div class="glabel">'+esc(grp.label)+' · '+ds.length+'</div><div class="dlist">';for(var i=0;i<ds.length;i++){h+=dir==='in'?'<div class="drow"><div>'+doorCard(ds[i])+'</div><span class="darrow">▸</span></div>':'<div class="drow"><span class="darrow">▸</span><div>'+doorCard(ds[i])+'</div></div>';}h+='</div></div>';}return h;}
function globalHTML(){var nin=DOORS.filter(function(d){return d.dir==='in';}).length,nout=DOORS.filter(function(d){return d.dir==='out';}).length,nopen=DOORS.filter(function(d){return d.dir==='in'&&(d.auth==='public'||d.auth==='none');}).length;return '<div class="plant"><div class="side left"><div class="colhead">▸ Entradas — lo que llega a la app</div>'+buildSide('in',GROUPS_IN)+'</div><div class="core"><div class="clogo">🏢</div><h2>'+esc(REPO)+'</h2><div class="csub">la aplicación</div><div class="cmeta"><span class="cin">'+nin+'</span> puertas de entrada<br><span class="cout">'+nout+'</span> puertas de salida<br><span class="cred">'+nopen+'</span> abiertas a cualquiera</div></div><div class="side right"><div class="colhead">Salidas — lo que la app envía ▸</div>'+buildSide('out',GROUPS_OUT)+'</div></div>';}
function detailHTML(id){var d=door(id);if(!d)return '';var inbound=d.dir==='in',am=authMeta(d.auth);var h='<div class="detail"><span class="pclose" data-close="1">×</span><div class="dtitle">'+(d.icon||'')+' '+esc(d.title)+'</div><div class="badges"><span class="bdg" style="color:'+(inbound?'#ff8a8d':'#8ab4ff')+'">'+(inbound?'Entrada':'Salida')+'</span><span class="bdg">'+esc(protoPlain(d.protocol))+'</span>'+(inbound?'<span class="bdg" style="color:'+am[0]+'">'+am[1]+'</span>':'<span class="bdg">🔑 '+esc(d.auth)+'</span>')+'</div><div class="dpurpose">'+esc(d.purpose)+'</div>';var ui=d.usedIn||USEDIN[d.id]||[];if(ui.length){h+='<div class="ml">'+(inbound?'Se usa en':'Se activa desde')+'</div><div class="urls">';for(var k=0;k<ui.length;k++){h+='<div class="url usedin">'+esc(ui[k])+'</div>';}h+='</div>';}var us=urlsFor(d);if(us.length){h+='<div class="ml">'+(inbound?'Dirección del endpoint':'A dónde se conecta')+'</div><div class="urls">';for(var u=0;u<us.length;u++){h+='<div class="url">'+esc(us[u])+'</div>';}h+='</div>';if(inbound&&d.type!=='cron')h+='<div class="urlnote">También funciona en la dirección web de cada cliente de la plataforma.</div>';}h+='<div class="drow2">'+(inbound?'':'<div><div class="ml">Llave que usa</div><div class="mf">'+esc(d.auth)+'</div></div>')+'<div><div class="ml">En el código (para devs)</div><div class="mf">'+d.files.map(esc).join('<br>')+'</div></div></div>';if(d.flags&&d.flags.length){h+='<div class="flags"><div class="flagsh">🚩 A revisar</div>';for(var g=0;g<d.flags.length;g++){var fl=d.flags[g];h+='<div class="flag"><span class="sev '+fl.s+'"></span><div><div class="ft2">'+esc(fl.t)+'</div><div class="fr">'+esc(fl.ref)+'</div></div></div>';}h+='</div>';}h+='</div>';return h;}
var panel=document.getElementById('panel'), shifted=false;
function showGlobal(){cv.innerHTML=globalHTML();fit();}
function showDoor(id){panel.innerHTML=detailHTML(id);panel.classList.add('open');if(!shifted){x-=200;shifted=true;apply();}}
function closePanel(){panel.classList.remove('open');if(shifted){x+=200;shifted=false;apply();}}
var s=1,x=0,y=0,drag=false,px,py,moved=false;
function apply(){cv.style.transform='translate('+x+'px,'+y+'px) scale('+s+')';}
function fit(){cv.style.transform='none';var w=cv.offsetWidth;s=Math.min(1,(window.innerWidth-80)/w);x=(window.innerWidth-w*s)/2;y=40;shifted=false;apply();}
vp.addEventListener('mousedown',function(e){drag=true;moved=false;px=e.clientX-x;py=e.clientY-y;vp.classList.add('grabbing');});
window.addEventListener('mouseup',function(){drag=false;vp.classList.remove('grabbing');});
window.addEventListener('mousemove',function(e){if(!drag)return;var nx=e.clientX-px,ny=e.clientY-py;if(Math.abs(nx-x)+Math.abs(ny-y)>4)moved=true;x=nx;y=ny;apply();});
vp.addEventListener('wheel',function(e){e.preventDefault();var dd=Math.exp(-e.deltaY*0.0015),ns=Math.min(2.2,Math.max(0.18,s*dd));var rx=e.clientX-x,ry=e.clientY-y;x=e.clientX-rx*(ns/s);y=e.clientY-ry*(ns/s);s=ns;apply();},{passive:false});
function zb(f){var cx=window.innerWidth/2,cy=window.innerHeight/2,rx=cx-x,ry=cy-y,ns=Math.min(2.2,Math.max(0.18,s*f));x=cx-rx*(ns/s);y=cy-ry*(ns/s);s=ns;apply();}
document.getElementById('zin').onclick=function(){zb(1.2);};
document.getElementById('zout').onclick=function(){zb(1/1.2);};
document.getElementById('zfit').onclick=function(){closePanel();fit();};
cv.addEventListener('click',function(e){if(moved)return;var c=e.target.closest('[data-door]');if(c){showDoor(c.getAttribute('data-door'));}});
panel.addEventListener('click',function(e){if(e.target.closest('[data-close]'))closePanel();});
window.addEventListener('keydown',function(e){if(e.key==='Escape')closePanel();});
showGlobal();
</script>
